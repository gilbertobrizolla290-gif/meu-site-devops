   name: Pipeline DevOps Aula

on:
  push:
    branches:
      - main

jobs:
  setup:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Listar arquivos
        run: ls -la

  validation:
    runs-on: ubuntu-latest
    needs: setup

    steps:
      - uses: actions/checkout@v4

      - name: Verificar index.html
        run: |
          if [ ! -f index.html ]; then
            echo "Arquivo não encontrado"
            exit 1
          fi

  build:
    runs-on: ubuntu-latest
    needs: validation

    steps:
      - uses: actions/checkout@v4

      - name: Criar pasta dist
        run: |
          mkdir dist
          cp index.html dist/

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Simulação deploy
        run: echo "Deploy executado"